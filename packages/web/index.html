    <title>Shucode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "shucode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-shucode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-shucode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-shucode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--shucode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--shucode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-shucode-bootstrap-theme="light"] body {
        background: var(--shucode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--shucode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-shucode-browser-theme-surface],
      html[data-shucode-browser-theme-surface] body,
      html[data-shucode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--shucode-bootstrap-bg, #161616)) !important;
      }

      html[data-shucode-browser-theme-surface="light"],
      html[data-shucode-browser-theme-surface="light"] body,
      html[data-shucode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--shucode-bootstrap-bg, #f8f8f8)) !important;
      }

      .shucode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--shucode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--shucode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-shucode-bootstrap-theme="light"] .shucode-boot-loading {
        background: var(--shucode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--shucode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .shucode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        /* 品牌 Logo 自带红底与圆角，壳只负责投影，避免叠出第二层底色。*/
        background: transparent;
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .shucode-boot-loading__logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        animation: shucode-boot-loading-pulse 1.5s ease-in-out infinite;
      }

      @keyframes shucode-boot-loading-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
