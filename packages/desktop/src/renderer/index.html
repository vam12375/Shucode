<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shucode</title>
    <style>
      /*
       * 启动壳沿用桌面「像素厨房」语义：米纸底、墨色字、品牌红、硬阴影。
       * 内联像素字文件在 public/fonts 下，font-display: block 保证字标首帧不闪系统字体。
       */
      @font-face {
        font-family: "Kitchen Pixel";
        src: url("./fonts/fusion-pixel-12.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.shucode-startup-ready #root {
        opacity: 1;
      }

      /* 启动壳是首帧唯一可见内容，必须自带不透明底色；Electron 窗口本体是透明的。 */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-paper);
        transition:
          opacity 0.34s cubic-bezier(0.33, 0, 0.2, 1),
          transform 0.34s cubic-bezier(0.33, 0, 0.2, 1),
          filter 0.34s cubic-bezier(0.33, 0, 0.2, 1);
      }

      /* 退场不只是淡出：整体轻微前推并提亮，像灶火被吹散开的一瞬。 */
      body.shucode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
        transform: translateY(-6px) scale(1.02);
        filter: brightness(1.12);
      }

      #loading {
        /* 与 desktop-pixel-kitchen.css 的 --pk-* 同源；这里独立声明，
           启动壳必须在 UI 包 CSS 加载前就成立，不能依赖外部 token。 */
        --splash-paper: #f1efdc;
        --splash-ink: #17120f;
        --splash-red: #c91d1f;
        --splash-line: #c9c4ad;
      }

      @media (prefers-color-scheme: dark) {
        #loading {
          --splash-paper: #211f1b;
          --splash-ink: #eee9d7;
          --splash-red: #e9796e;
          --splash-line: #575043;
        }
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Kitchen Pixel", ui-monospace, "PingFang SC", "Microsoft YaHei", monospace;
        font-size: 12px;
        line-height: 1.6;
        color: var(--splash-ink);
      }

      /*
       * 品牌 mark 逐格绘制。后备缓冲必须是格子数的整数倍（64 格 × 3 = 192），
       * 否则每格尺寸出现小数，像素边缘会发虚。显示尺寸与后备缓冲 1:1，
       * 再由 image-rendering 保证高 DPI 缩放后仍是硬边。
       */
      .splash-mark {
        display: block;
        width: 192px;
        height: 192px;
        image-rendering: pixelated;
      }

      .splash-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 16px;
      }

      .splash-eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--splash-red);
        animation: splash-fade-up 0.4s ease-out 0.34s both;
      }

      /* 字标与红色光标同一行，光标贴在文字右侧基线处。 */
      .splash-wordmark-row {
        display: flex;
        align-items: flex-end;
        margin-top: 6px;
      }

      .splash-wordmark {
        display: flex;
        font-size: 34px;
        line-height: 1.1;
        letter-spacing: 0.02em;
      }

      /* 逐字旋起；纯展示节点，完整名称由 .splash-sr 提供给辅助技术。 */
      .splash-wordmark span {
        animation: splash-letter-rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
        transform-origin: center bottom;
      }

      .splash-wordmark span:nth-child(1) { animation-delay: 0.66s; }
      .splash-wordmark span:nth-child(2) { animation-delay: 0.69s; }
      .splash-wordmark span:nth-child(3) { animation-delay: 0.72s; }
      .splash-wordmark span:nth-child(4) { animation-delay: 0.75s; }
      .splash-wordmark span:nth-child(5) { animation-delay: 0.78s; }
      .splash-wordmark span:nth-child(6) { animation-delay: 0.81s; }
      .splash-wordmark span:nth-child(7) { animation-delay: 0.84s; }

      .splash-caret {
        width: 8px;
        height: 3px;
        margin-bottom: 5px;
        margin-left: 4px;
        background: var(--splash-red);
        animation:
          splash-caret-in 0.3s ease-out 1.04s both,
          splash-caret-blink 0.92s step-end 1.34s infinite;
      }

      @keyframes splash-letter-rise {
        0% {
          opacity: 0;
          transform: translateY(8px) rotate(7deg);
        }

        100% {
          opacity: 1;
          transform: translateY(0) rotate(0deg);
        }
      }

      @keyframes splash-fade-up {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }

        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes splash-caret-in {
        0% {
          opacity: 0;
          transform: scaleX(0.2);
        }

        100% {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @keyframes splash-caret-blink {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.15;
        }
      }

      /* 三格对应三个真实里程碑：像素组装完成、字标显形、React 首屏接管；
         纯展示，不承诺进度，进度语义仍由 RootStartupLoading 负责。 */
      .splash-timeline {
        display: flex;
        gap: 5px;
        margin-top: 22px;
      }

      .splash-tick {
        width: 6px;
        height: 6px;
        background: var(--splash-line);
        transition:
          background 0.26s ease,
          transform 0.26s ease;
      }

      .splash[data-stage="1"] .splash-tick:nth-child(-n + 1),
      .splash[data-stage="2"] .splash-tick:nth-child(-n + 2),
      .splash[data-stage="3"] .splash-tick:nth-child(-n + 3) {
        background: var(--splash-red);
        transform: translateY(-1px);
      }

      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        /* 减少动态效果：mark 直接呈现组装完成的终态，文字无延迟显示。 */
        .splash-eyebrow,
        .splash-wordmark span,
        .splash-caret {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .splash-caret {
          animation: splash-caret-blink 0.92s step-end infinite;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="splash" data-stage="0">
        <canvas class="splash-mark" width="192" height="192" aria-hidden="true"></canvas>
        <div class="splash-title">
          <span class="splash-eyebrow">Pixel Kitchen</span>
          <span class="splash-wordmark-row">
            <span class="splash-wordmark" aria-hidden="true">
              <span>S</span><span>h</span><span>u</span><span>c</span><span>o</span
              ><span>d</span><span>e</span>
            </span>
            <span class="splash-caret" aria-hidden="true"></span>
          </span>
          <span class="splash-sr">Shucode</span>
        </div>
        <div class="splash-timeline" aria-hidden="true">
          <span class="splash-tick"></span>
          <span class="splash-tick"></span>
          <span class="splash-tick"></span>
        </div>
      </div>
    </div>
    <script type="module">
      /*
       * 启动壳动画：品牌 mark 由 64×64 个像素格组装而成。
       *
       * 时间轴（毫秒）：
       *   0–720     像素从散落状态逐格吸附，径向波次，带落下过冲
       *   760–1180  组装完成后，一道暖光沿对角线横扫过 mark
       *   660–1260  字标逐字旋起，光标与进度格点亮
       *   退场      React 就绪后像素向外炸开消散，同时整壳前推提亮
       *
       * 动画只负责展示；启动完成判定仍由「动画结束 + React 就绪」两个条件共同决定。
       */
      const splash = document.querySelector(".splash");
      const startupLoading = document.getElementById("loading");
      const markCanvas = document.querySelector(".splash-mark");
      const markData = document.getElementById("splash-mark-data");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /** 单格落下的时长；与延迟之和决定所有像素到位的时刻。 */
      const FALL_MS = 380;
      /** 径向波次的最远延迟，中心格先落，边缘格随后收拢。 */
      const STAGGER_MS = 260;
      const JITTER_MS = 80;
      const SWEEP_START_MS = 760;
      const SWEEP_MS = 420;
      /** 组装与暖光全部结束的时刻，之后停帧保持终态等待 React。 */
      const HOLD_MS = SWEEP_START_MS + SWEEP_MS;
      /** 退场时像素炸开的时长。 */
      const DISSOLVE_MS = 420;

      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 三格进度只由真实里程碑点亮，且必须单调推进：里程碑可能乱序到达。
      let stage = 0;
      const markStage = (next) => {
        if (next <= stage) return;
        stage = next;
        if (splash) splash.dataset.stage = String(next);
      };

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        // 先让像素炸开，再整壳退场，避免遮罩瞬间消失造成闪白。
        dissolveMark();
        document.body.classList.add("shucode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 440);
      };

      const markAnimationDone = () => {
        if (animationDone) return;
        animationDone = true;
        markStage(2);
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        markStage(3);
        tryFinishStartupAnimation();
      };

      /* ---------- 像素数据解析 ---------- */

      /**
       * 解析内联的像素网格：调色板是逗号分隔的 6 位 hex 字符串，
       * 索引串每字符是一个 4bit 索引，0 表示透明，实体色从 1 开始。
       */
      function parseMarkData() {
        if (!markData) return null;
        let raw;
        try {
          raw = JSON.parse(markData.textContent ?? "");
        } catch {
          return null;
        }
        if (!raw || typeof raw.grid !== "number" || typeof raw.packed !== "string") return null;
        if (typeof raw.palette !== "string" || raw.palette.length === 0) return null;

        const palette = raw.palette.split(",").map((hex) => {
          const value = Number.parseInt(hex, 16);
          return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
        });
        if (palette.some((rgb) => rgb.some((channel) => Number.isNaN(channel)))) return null;

        return { grid: raw.grid, packed: raw.packed, palette };
      }

      /** 把索引串展开成待绘制的像素格，并预计算每个格子的落点参数。 */
      function createMark(raw) {
        const { grid, packed, palette } = raw;
        // 每字符一个 4bit 索引，格子总数必须与索引串长度一致。
        if (packed.length !== grid * grid) return null;

        const cells = [];
        const half = grid / 2;
        for (let index = 0; index < packed.length; index++) {
          const colorIndex = Number.parseInt(packed.charAt(index), 16);
          if (!Number.isFinite(colorIndex) || colorIndex === 0) continue;
          const rgb = palette[colorIndex - 1];
          if (!rgb) continue;

          const x = index % grid;
          const y = (index - x) / grid;
          const dx = x + 0.5 - half;
          const dy = y + 0.5 - half;
          const radius = Math.min(1, Math.hypot(dx, dy) / half);

          cells.push({
            x,
            y,
            rgb,
            // 径向波次：中心先落位，边缘随后追上，形成一次收拢。
            delay: radius * STAGGER_MS + Math.random() * JITTER_MS,
            // 每个像素从 mark 上方不同高度、带水平漂移落下。
            fromX: (Math.random() - 0.5) * 22,
            fromY: -(14 + Math.random() * 20),
            // 过冲挤压的相位偏移，避免所有像素同时鼓起来。
            squeeze: 0.6 + Math.random() * 0.8,
          });
        }
        return { grid, palette, cells };
      }

      /* ---------- 绘制 ---------- */

      let mark = null;
      let dissolveMark = () => undefined;

      function markScale() {
        // 后备缓冲必须是格子数的整数倍，格子边长才是整数像素。
        return markCanvas.width / mark.grid;
      }

      function drawStatic() {
        const ctx = markCanvas.getContext("2d");
        const scale = markScale();
        ctx.clearRect(0, 0, markCanvas.width, markCanvas.height);
        for (const cell of mark.cells) {
          const [r, g, b] = cell.rgb;
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.fillRect(cell.x * scale, cell.y * scale, scale, scale);
        }
      }

      function drawFrame(elapsed, sweepProgress, sweeping) {
        const ctx = markCanvas.getContext("2d");
        const scale = markScale();
        const grid = mark.grid;
        const span = grid * 2 - 2;
        ctx.clearRect(0, 0, markCanvas.width, markCanvas.height);

        for (const cell of mark.cells) {
          const t = (elapsed - cell.delay) / FALL_MS;
          if (t <= 0) continue;
          const settled = t >= 1;

          // 落下轨迹：三次缓出，落位前速度收住。
          const eased = settled ? 1 : 1 - (1 - t) ** 3;
          // 未落位的部分按 1-eased 距离插值回位。
          const remaining = 1 - eased;
          const px = cell.x + cell.fromX * remaining;
          const py = cell.y + cell.fromY * remaining;

          // 落点挤压：t 接近 1 时轻微横向拉伸、纵向压缩，落地后复原。
          const impact = settled ? 0 : Math.sin(t * Math.PI) * cell.squeeze;
          const w = scale * (1 + impact * 0.16);
          const h = scale * (1 - impact * 0.12);

          let [r, g, b] = cell.rgb;
          if (sweeping) {
            // 暖光沿对角线扫过：命中窗口内的像素向米白提亮。
            const band = (grid - 1 - cell.x + cell.y) / span;
            const distance = Math.abs(band - sweepProgress);
            if (distance < 0.11) {
              const glow = (1 - Math.sqrt(distance / 0.11)) * 0.9;
              r += (255 - r) * glow;
              g += (250 - g) * glow;
              b += (228 - b) * glow;
            }
          }

          ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
          // 未落位的像素半透明，落位后完全不透明，像是在「显影」。
          ctx.globalAlpha = settled ? 1 : 0.3 + eased * 0.7;
          ctx.fillRect(px * scale, py * scale, w, h);
        }
        ctx.globalAlpha = 1;
      }

      function drawDissolve(t) {
        const ctx = markCanvas.getContext("2d");
        const scale = markScale();
        const grid = mark.grid;
        const half = grid / 2;
        ctx.clearRect(0, 0, markCanvas.width, markCanvas.height);

        const eased = t * t;
        for (const cell of mark.cells) {
          const dx = cell.x + 0.5 - half;
          const dy = cell.y + 0.5 - half;
          const length = Math.hypot(dx, dy) || 1;
          // 消散：像素沿各自径向向外飞散并缩小，像被灶火吹开。
          const push = (10 + length * 2.2) * eased;
          const px = cell.x + (dx / length) * push;
          const py = cell.y + (dy / length) * push - eased * 6;
          const size = scale * (1 - t);
          if (size <= 0) continue;
          const [r, g, b] = cell.rgb;
          ctx.globalAlpha = 1 - t;
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.fillRect(px * scale, py * scale, size, size);
        }
        ctx.globalAlpha = 1;
      }

      function startMarkAnimation() {
        const started = performance.now();
        let burstAt = 0;
        let raf = 0;
        let stopped = false;

        const frame = (now) => {
          if (stopped) return;

          if (burstAt > 0) {
            const t = (now - burstAt) / DISSOLVE_MS;
            if (t >= 1) {
              markCanvas.getContext("2d").clearRect(0, 0, markCanvas.width, markCanvas.height);
              return;
            }
            drawDissolve(t);
            raf = requestAnimationFrame(frame);
            return;
          }

          const elapsed = now - started;
          const sweeping = elapsed > SWEEP_START_MS;
          const sweepProgress = sweeping
            ? Math.min(1, (elapsed - SWEEP_START_MS) / SWEEP_MS)
            : 0;
          drawFrame(elapsed, sweepProgress, sweeping);

          if (elapsed >= HOLD_MS) {
            // 停帧保持组装终态，等 React 就绪后再由 dissolveMark 接管。
            drawStatic();
            markAnimationDone();
            return;
          }
          raf = requestAnimationFrame(frame);
        };

        raf = requestAnimationFrame(frame);

        // 窗口被遮挡时 rAF 可能长时间不调度，用一次定时器兜底，
        // 保证启动壳不会因为动画没跑完而一直盖住界面。
        window.setTimeout(markAnimationDone, HOLD_MS + 400);

        dissolveMark = () => {
          burstAt = performance.now();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        };

        return () => {
          stopped = true;
          cancelAnimationFrame(raf);
        };
      }

      /* ---------- 启动编排 ---------- */

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 mark 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("shucode-startup-ready");
        startupLoading?.remove();
      } else {
        markStage(1);
        window.addEventListener("shucode-react-startup-ready", markReactReady, { once: true });
      }

      const rawMark = parseMarkData();
      mark = rawMark ? createMark(rawMark) : null;
      if (mark) {
        markCanvas.getContext("2d").imageSmoothingEnabled = false;
      }

      if (isUpdateStatusWindow) {
        // 该窗口已直接退场，无需再跑动画。
      } else if (!mark || reduceMotion) {
        // 数据缺失或偏好减少动态效果：直接呈现组装完成的终态，不延迟任何内容。
        if (mark) drawStatic();
        markAnimationDone();
      } else {
        startMarkAnimation();
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
